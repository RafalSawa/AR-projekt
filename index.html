<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Podgląd 3D na stole</title>
  <script type="module" src="https://googleapis.com"></script>
  <style>
    body { margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #f4f4f4; }
    model-viewer { width: 100%; height: 100%; }
    .ar-btn {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      padding: 14px 28px; background: #111; color: #fff; border: none;
      border-radius: 30px; font-family: sans-serif; font-size: 16px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

  <model-viewer 
    src="./model.glb" 
    ar 
    ar-modes="scene-viewer webxr quick-look" 
    ar-placement="floor"
    camera-controls 
    auto-rotate 
    shadow-intensity="1"
    alt="Model 3D">
    
    <button slot="ar-button" class="ar-btn">
      Postaw na stole (AR)
    </button>

  </model-viewer>

</body>
</html>
